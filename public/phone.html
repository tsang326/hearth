<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hearth — parent phone</title>
<style>
:root{--fg:#1c1714;--muted:#7d7166;--card:#fff;--line:#ebe3da;--accent:#e2531a;--ok:#1f8a5a;--warn:#a86a00}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e9e4de;font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--fg);display:flex;justify-content:center;min-height:100vh}
.app{width:390px;max-width:100%;min-height:100vh;background:linear-gradient(180deg,#fbf7f2,#f3eee8);padding:20px 16px 28px}
body.embed{background:transparent}
body.embed .app{width:100%;padding-top:54px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#ff9a4d,#e2531a);display:grid;place-items:center;font-size:18px}
h1{font-size:19px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 16px}
.sw{display:flex;background:#e7dfd6;border-radius:12px;padding:3px;margin-bottom:16px}
.sw button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.sw button.on{background:#fff;color:var(--fg);box-shadow:0 1px 3px #0002}
.n{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #5a3a1a14;border:1px solid var(--line)}
.n.new{animation:slide .45s ease}
@keyframes slide{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.n .head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:8px}
.n .head .dot{width:20px;height:20px;border-radius:6px;background:linear-gradient(145deg,#ff9a4d,#e2531a);display:grid;place-items:center;font-size:11px}
.n .head .when{margin-left:auto}
.n .t{font-weight:700;font-size:16px}
.n .amt{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:2px 0 6px}
.items{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.items span{background:#f4ede5;border-radius:999px;padding:4px 10px;font-size:13px}
.r{color:var(--warn);font-size:12.5px;background:#fff6e5;border-radius:10px;padding:7px 9px}
.btns{display:flex;gap:8px;margin-top:12px}
button.act{flex:1;border:0;border-radius:14px;padding:12px;font-weight:700;font-size:15px;cursor:pointer}
.yes{background:var(--ok);color:#fff}.no{background:#efe8e0;color:var(--fg)}
.done{font-size:13px;font-weight:700;margin-top:10px}.done.ok{color:var(--ok)}.done.bad{color:#b4412a}
.empty{color:var(--muted);font-size:14px;text-align:center;margin-top:60px}
.empty .big{font-size:38px;margin-bottom:6px}
.foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo">🔥</div><div><h1><span id="who">Ada</span>’s phone</h1></div></div>
  <div class="sub">Requests from the kitchen assistant that need you</div>
  <div class="sw"><button data-p="ada">Ada</button><button data-p="ben">Ben</button></div>
  <div id="list"></div>
  <div class="foot">Only this phone can release a held list. Nothing said to the kitchen device can.</div>
</div>
<script>
const q = new URLSearchParams(location.search)
if (q.get('embed')) document.body.classList.add('embed')
const key = q.get('key') || 'parent-demo'
const h = q.get('h') || 'demo'
let parent = q.get('m') === 'ben' ? 'ben' : 'ada'
const NAMES = { ada: 'Ada', ben: 'Ben' }
const seen = new Set()
let first = true
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const ago = (t) => { const s = Math.max(0, (Date.now() - Date.parse(t)) / 1000); return s < 60 ? 'now' : s < 3600 ? Math.round(s / 60) + 'm ago' : Math.round(s / 3600) + 'h ago' }
function label() {
  document.getElementById('who').textContent = NAMES[parent]
  document.title = 'Hearth — ' + NAMES[parent] + '’s phone'
  document.querySelectorAll('.sw button').forEach((b) => b.classList.toggle('on', b.dataset.p === parent))
}
document.querySelectorAll('.sw button').forEach((b) => b.onclick = () => { parent = b.dataset.p; label(); first = true; load() })
label()
async function load() {
  const r = await (await fetch('/api/approvals?key=' + encodeURIComponent(key) + '&h=' + encodeURIComponent(h) + '&m=' + parent)).json()
  const list = document.getElementById('list')
  if (r.error) { list.innerHTML = '<div class="empty">' + esc(r.error) + '</div>'; return }
  list.innerHTML = r.approvals.length ? r.approvals.map((a) => {
    const fresh = !first && !seen.has(a.id)
    seen.add(a.id)
    return `<div class="n${fresh ? ' new' : ''}"><div class="head"><span class="dot">🔥</span>HEARTH<span class="when">${ago(a.createdAt)}</span></div>` +
      `<div class="t">${esc(a.requestedByName)} wants to buy</div><div class="amt">$${a.total}</div>` +
      `<div class="items">${a.items.map((i) => `<span>${esc(i)}</span>`).join('')}</div><div class="r">Why it needs you: ${esc(a.reason)}</div>` +
      (a.status === 'pending' ? `<div class="btns"><button class="act no" data-u="${esc(a.links.decline)}">Decline</button><button class="act yes" data-u="${esc(a.links.approve)}">Approve</button></div>`
        : `<div class="done ${a.status === 'approved' ? 'ok' : 'bad'}">${a.status === 'approved' ? '✓ You approved this' : '✕ You declined this'}</div>`) + '</div>'
  }).join('') : '<div class="empty"><div class="big">🌙</div>Nothing waiting for you.</div>'
  first = false
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-u]'); if (!b) return
  b.disabled = true
  await fetch(b.dataset.u, { headers: { accept: 'application/json' } })
  load()
})
// Poll only while someone is looking (free Redis quota). Embedded in the console, the
// console's activity counts; opened alone, this page's own.
let lastActive = Date.now()
for (const ev of ['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart']) addEventListener(ev, () => { lastActive = Date.now() }, { passive: true })
const active = () => { try { if (window.parent !== window && window.parent.__lastActive) return Math.max(lastActive, window.parent.__lastActive) } catch {} return lastActive }
const looking = () => document.visibilityState === 'visible' && Date.now() - active() < 10 * 60_000
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { lastActive = Date.now(); load() } })
load(); setInterval(() => { if (looking()) load() }, 4000)
</script>
</body>
</html>
